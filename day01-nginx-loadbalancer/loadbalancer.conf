upstream mybackends {
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
    server 127.0.0.1:8083;
}

server {
    listen 127.0.0.1:8081;
    root /var/www/site1;
}

server {
    listen 127.0.0.1:8082;
    root /var/www/site2;
}

server {
    listen 127.0.0.1:8083;
    root /var/www/site3;
}

server {
    listen 80;
    location / {
        proxy_pass http://mybackends;
    }
}
