services:
  site1:
    image: nginx
    volumes:
      - ./site1:/usr/share/nginx/html

  site2:
    image: nginx
    volumes:
      - ./site2:/usr/share/nginx/html

  site3:
    image: nginx
    volumes:
      - ./site3:/usr/share/nginx/html

  loadbalancer:
    image: nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - site1
      - site2
      - site3
